name: Repair stale workspace test

on:
  push:
    branches: [developer]
    paths:
      - .github/workflows/repair-stale-workspace-test.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Align the stale heavy-workspace expectation
        env:
          EXPECTED_PARENT: 951211fa8bc2a9ba2bd2d1a76faadf89a3258280
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/opencode-bridge/tests/workspace.test.ts")
          text = path.read_text()
          old = '"heavy-workspace-maintainer"'
          new = '"workspace-maintainer"'
          if text.count(old) != 2:
              raise SystemExit("expected exactly two stale heavy-workspace assertions")
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/opencode-bridge/tests/workspace.test.ts
          git commit -m "test: align workspace heavy route"
          git push origin HEAD:developer
