name: Diagnose Dual proof activation

on:
  push:
    branches: [developer]
    paths:
      - .github/workflows/diagnose-dual-proof.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Publish activation marker
        run: |
          set -euo pipefail
          mkdir -p docs/work/progress
          cat > docs/work/progress/DUAL-PROOF-DIAGNOSTIC.md <<'EOF'
          # Dual proof diagnostic

          Workflow activation: passed
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/work/progress/DUAL-PROOF-DIAGNOSTIC.md
          git commit -m "chore: record Dual diagnostic activation"
          git push origin HEAD:developer
