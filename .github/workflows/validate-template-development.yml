name: Validate template development

on:
  push:
    branches: [template-development]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22.13.0
      - run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - name: Enable Bubblewrap namespaces on the ephemeral Ubuntu runner
        run: sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm install --prefix .opencode --ignore-scripts --no-audit --no-fund
      - run: node .opencode/node_modules/opencode-ai/postinstall.mjs
      - run: chmod +x .githooks/* scripts/*.sh scripts/*.mjs
      - run: ./scripts/validate-template-development.sh
      - name: Publish exact-SHA validation status
        if: ${{ always() && github.event_name == 'push' }}
        env:
          GH_STATUS_TOKEN: ${{ github.token }}
          VALIDATION_JOB_STATUS: ${{ job.status }}
          STATUS_CONTEXT: agentic-template/validate-template-development
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          case "${VALIDATION_JOB_STATUS}" in
            success) state=success ;;
            failure) state=failure ;;
            *) state=error ;;
          esac
          payload="$(jq -cn \
            --arg state "${state}" \
            --arg target_url "${RUN_URL}" \
            --arg description "Canonical template validation: ${state}" \
            --arg context "${STATUS_CONTEXT}" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_STATUS_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "${payload}"
