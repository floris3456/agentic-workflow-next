name: Validate template development

on:
  push:
    branches: [template-development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22.13.0
      - run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - name: Enable Bubblewrap namespaces on the ephemeral Ubuntu runner
        run: sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm install --prefix .opencode --ignore-scripts --no-audit --no-fund
      - run: node .opencode/node_modules/opencode-ai/postinstall.mjs
      - run: chmod +x .githooks/* scripts/*.sh scripts/*.mjs
      - run: ./scripts/validate-template-development.sh
