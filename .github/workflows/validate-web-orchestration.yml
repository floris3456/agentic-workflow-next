name: Validate web orchestration

on:
  push:
    branches: [web-orchestration]

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node runtime
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22.13.0
      - name: Run orchestration package validator
        run: node web-orchestration-only/validate-package.mjs
      - name: Run Node tests
        run: node --test
      - name: Publish exact-SHA validation status
        if: ${{ always() && github.event_name == 'push' }}
        env:
          GH_STATUS_TOKEN: ${{ github.token }}
          VALIDATION_JOB_STATUS: ${{ job.status }}
          STATUS_CONTEXT: agentic-template/validate-web-orchestration
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          case "${VALIDATION_JOB_STATUS}" in
            success) state=success ;;
            failure) state=failure ;;
            *) state=error ;;
          esac
          payload="$(jq -cn \
            --arg state "${state}" \
            --arg target_url "${RUN_URL}" \
            --arg description "Canonical web validation: ${state}" \
            --arg context "${STATUS_CONTEXT}" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_STATUS_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "${payload}"
